name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgis_adapter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_VERSION: ${{ matrix.rails }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        rails: ['8.0', '8.1']

    name: test (ruby ${{ matrix.ruby }}, rails ${{ matrix.rails }})

    steps:
      - uses: actions/checkout@v5

      # rgeo's CAPI extension links against GEOS at build time, so libgeos-dev
      # must be present before `bundle install` compiles the native extension.
      - name: Install GEOS
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
